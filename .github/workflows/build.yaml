name: build
on: 
  workflow_dispatch:
    inputs:
      windmillVersion:
        description: "The windmill version to build for"
        required: true
        default: '1.402'
        type: string

#  push:
#    branches: ["main"]
#workflow_dispatch:


env:
  PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout
        uses: actions/checkout@v2
      - 
        name: Setup QEMU
        uses: docker/setup-qemu-action@v2
      - 
        name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      - 
        name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: scheiblingco
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: scheibling
          password: ${{ env.PASSWORD }}
      - 
        name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            AGENT_VERSION=${{ inputs.windmillVersion }}
          push: true
          tags: |
            ghcr.io/scheiblingco/windmill-x:${{ inputs.windmillVersion }}
            docker.io/scheibling/windmill-x:${{ inputs.windmillVersion }}
